<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGL Spectrogram | By Claude and I</title>
    <style>
        body {
            margin: 0;
            padding: 0 2px;
            background: #000000;
            color: white;
            font-family: monospace, sans-serif;
        }
        canvas {
            border: 1px solid #111;
            border-radius: 16px;
            display: block;
            margin: 0 auto;
            width: 90%;
        }
        .controls {
            text-align: center;
            margin: 20px 5px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            background: #012;
            color: #ccc;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background: #123;
        }
        .info {
            text-align: center;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="controls">
        <!-- <button onclick="startDemo()">Start Demo</button> -->
        <button onclick="stopDemo()">Stop</button>
        <button onclick="startAudio()">Use Microphone</button>
    </div>
    <canvas id="canvas" width="1024" height="400"></canvas>

    <script>
        let gl, program, positionBuffer, colorBuffer;
        let animationId;
        let audioContext, analyser, dataArray;
        let isUsingAudio = true;

        // Vertex shader
        const vertexShaderSource = `
            attribute vec2 a_position;
            attribute vec3 a_color;
            varying vec3 v_color;
            uniform vec2 u_resolution;
            
            void main() {
                vec2 zeroToOne = a_position / u_resolution;
                vec2 zeroToTwo = zeroToOne * 2.0;
                vec2 clipSpace = zeroToTwo - 1.0;
                gl_Position = vec4(clipSpace * vec2(1, -1), 0, 1);
                v_color = a_color;
            }
        `;

        // Fragment shader
        const fragmentShaderSource = `
            precision mediump float;
            varying vec3 v_color;
            
            void main() {
                gl_FragColor = vec4(v_color, 1.0);
            }
        `;

        function createShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error('Shader compilation error:', gl.getShaderInfoLog(shader));
                gl.deleteShader(shader);
                return null;
            }
            return shader;
        }

        function createProgram(gl, vertexShader, fragmentShader) {
            const program = gl.createProgram();
            gl.attachShader(program, vertexShader);
            gl.attachShader(program, fragmentShader);
            gl.linkProgram(program);
            
            if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                console.error('Program linking error:', gl.getProgramInfoLog(program));
                gl.deleteProgram(program);
                return null;
            }
            return program;
        }

        function initWebGL() {
            const canvas = document.getElementById('canvas');
            gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            
            if (!gl) {
                alert('WebGL not supported');
                return false;
            }

            // Create shaders
            const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
            const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);
            program = createProgram(gl, vertexShader, fragmentShader);

            // Create buffers
            positionBuffer = gl.createBuffer();
            colorBuffer = gl.createBuffer();

            // Set viewport
            gl.viewport(0, 0, canvas.width, canvas.height);
            gl.clearColor(0, 0, 0, 1.0);

            return true;
        }

        function generateDemoData() {
            const data = new Uint8Array(512); // 128 frequency bins
            const time = Date.now() * 0.001;
            
            for (let i = 0; i < data.length; i++) {
                // Create interesting demo patterns
                const freq1 = Math.sin(time * 2 + i * 0.1) * 0.5 + 0.5;
                const freq2 = Math.sin(time * 0.5 + i * 0.05) * 0.3 + 0.3;
                const noise = Math.random() * 0.2;
                data[i] = Math.floor((freq1 + freq2 + noise) * 255);
            }
            return data;
        }

        function drawSpectrogram(frequencyData) {
            const canvas = document.getElementById('canvas');
            const width = canvas.width;
            const height = canvas.height;
            const barCount = frequencyData.length;
            const barWidth = width / barCount;

            // Generate vertices for bars
            const positions = [];
            const colors = [];

            for (let i = 0; i < barCount; i++) {
                const value = (frequencyData[i] / 255) || 0.001; // Normalize to 0-1
                const barHeight = value * height;
                const x = i * barWidth;

                // Two triangles per bar (rectangle)
                // Triangle 1
                positions.push(x, (height / 2) + (barHeight / 2));           // bottom left
                positions.push(x + barWidth, (height / 2) + (barHeight / 2)); // bottom right
                positions.push(x, (height / 2) - (barHeight / 2)); // top left

                // Triangle 2
                positions.push(x + barWidth, (height / 2) + (barHeight / 2)); // bottom right
                positions.push(x + barWidth, (height / 2) - (barHeight / 2)); // top right
                positions.push(x, (height / 2 ) - (barHeight / 2)); // top left

                // Color based on frequency and amplitude
                const hue = (i / barCount) * 0.8; // 0 to 0.8 (red to blue)
                const saturation = 0.8;
                const lightness = value * 0.8 + 0.2; // Minimum brightness

                // Convert HSL to RGB
                const rgb = hslToRgb(hue, saturation, lightness);
                
                // Add color for each vertex (6 vertices per bar)
                for (let j = 0; j < 6; j++) {
                    colors.push(rgb[0], rgb[1], rgb[2]);
                }
            }

            // Update position buffer
            gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.DYNAMIC_DRAW);

            // Update color buffer
            gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(colors), gl.DYNAMIC_DRAW);

            // Clear and draw
            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.useProgram(program);

            // Set resolution uniform
            const resolutionLocation = gl.getUniformLocation(program, 'u_resolution');
            gl.uniform2f(resolutionLocation, width, height);

            // Bind position attribute
            const positionLocation = gl.getAttribLocation(program, 'a_position');
            gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
            gl.enableVertexAttribArray(positionLocation);
            gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

            // Bind color attribute
            const colorLocation = gl.getAttribLocation(program, 'a_color');
            gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
            gl.enableVertexAttribArray(colorLocation);
            gl.vertexAttribPointer(colorLocation, 3, gl.FLOAT, false, 0, 0);

            // Draw all triangles
            gl.drawArrays(gl.TRIANGLES, 0, positions.length / 2);
        }

        function hslToRgb(h, s, l) {
            const c = (1 - Math.abs(2 * l - 1)) * s;
            const x = c * (1 - Math.abs((h * 6) % 2 - 1));
            const m = l - c / 2;
            let r, g, b;

            if (h < 1/6) { r = c; g = x; b = 0; }
            else if (h < 2/6) { r = x; g = c; b = 0; }
            else if (h < 3/6) { r = 0; g = c; b = x; }
            else if (h < 4/6) { r = 0; g = x; b = c; }
            else if (h < 5/6) { r = x; g = 0; b = c; }
            else { r = c; g = 0; b = x; }

            return [r + m, g + m, b + m];
        }

        function animate() {
            let data;
            
            if (isUsingAudio && analyser) {
                analyser.getByteFrequencyData(dataArray);
                data = dataArray;
            } else {
                data = generateDemoData();
            }
            
            drawSpectrogram(data);
            animationId = requestAnimationFrame(animate);
        }

        function startDemo() {
            isUsingAudio = false;
            stopDemo();
            animate();
        }

        function stopDemo() {
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
        }

        async function startAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 2048;
                source.connect(analyser);
                const sampleRate = audioContext.sampleRate;
                const frequencyResolution = sampleRate / analyser.fftSize;
                
                dataArray = new Uint8Array(analyser.frequencyBinCount).filter((_, i) => {
                    const frequency = i * frequencyResolution;
                    return frequency > 25 && frequency < 15_000;
                });
                isUsingAudio = true;
                
                stopDemo();
                animate();
            } catch (err) {
                console.error('Microphone access denied:', err);
                alert('Microphone access is required for audio visualization');
            }
        }

        // Initialize WebGL when page loads
        window.onload = function() {
            if (initWebGL()) {
                startDemo();
            }
        };
    </script>
</body>
</html>
